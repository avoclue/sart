name = "sart"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"
# The Worker runs first on these paths so it can enforce admin auth and serve the API.
run_worker_first = ["/api/*", "/admin", "/admin/*"]

[[d1_databases]]
binding = "DB"
database_name = "sart"
# Set this to your own D1 database ID before deploying (see README). Not committed.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"
